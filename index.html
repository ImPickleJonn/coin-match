<!DOCTYPE html>
<html lang="en">

<body>
  <div id="app"></div>
  <div id="boot">LOADING…</div>
  <script>
'use strict';
/* =====================================================================
   COIN MATCH — Pixi rebuild v0.8.0
   =====================================================================
   Built from scratch on Pixi.js v7. Main play screen only.

   What's IN:
     - Layout shell:  topbar  ·  GAE bar  ·  HUD row  ·  board  ·
                      action deck (4 boosters + AUTO)  ·  bottom nav
     - Match-3 core:  7×7 grid, swap, cascade, gravity, refill
     - Reward policy: gold tiles → gold; effect tiles → meters/energy
     - Prize banner:  multi-chip display in HUD prize slot
     - Pixi animation system: swap, pop, fall, idle wobble

   What's OUT (build on top later):
     - Other screens (village, shop, friends)
     - Special detonations (arrow beam / bomb / lightning FX)
     - Booster armed state + activation
     - Auto solver, sound, haptics, Telegram, save/load, IAP, i18n
   ===================================================================== */

// =====================================================================
// [1] CONSTANTS
// =====================================================================
const COLS = 7, ROWS = 7;
const NUM_COLORS = 4;

const TILE = { COIN:0, SACK:1, CHEST:2, THEME:3, SHIELD:4, PIG:5, BOLT:6, WILD:7, STAR:8 };
const SP_NONE=0, SP_ARROW_H=1, SP_ARROW_V=2, SP_BOMB=3, SP_LIGHTNING=4;

// Tile texture key by tile type
const TYPE_TO_KEY = ['coin','sack','chest','theme','shield','pig','bolt','wild','star'];

// Per-tile base gold value (only used when isGoldTile)
const TILE_VALUE = { 0:1.0, 1:2.0, 2:4.0, 3:1.5, 4:1.0, 5:1.0, 6:1.0, 7:1.0, 8:3.0 };

// Spawn weights. THEME picks up the remainder (~25%).
const SPAWN_RATE = {
  STAR:0.008, WILD:0.012, BOLT:0.05, PIG:0.06,
  SHIELD:0.06, CHEST:0.08, SACK:0.18, COIN:0.30
};

const CASCADE_MULT = [1, 1, 1.5, 2.0, 3.0, 5.0, 7.0, 10.0, 15.0, 20.0];
const METER_CAP = 20;
const ENERGY_MAX = 30;

const BETS = [
  {mult:1, label:'×1'}, {mult:2, label:'×2'},
  {mult:3, label:'×3'}, {mult:5, label:'×5'},
];

// Asset paths
const ASSET = {
  coin:        '/assets/tiles/01_coin.png',
  sack:        '/assets/tiles/02_purple_sack_of_coins.png',
  chest:       '/assets/tiles/03_closed_treasure_chest.png',
  bolt:        '/assets/tiles/04_blue_energy_bolt.png',
  pig:         '/assets/tiles/05_chicken_steal_mascot.png',
  theme:       '/assets/tiles/06_cute_attack_glove.png',
  shield:      '/assets/tiles/07_shield.png',
  wild:        '/assets/tiles/08_tile_wild.png',
  star:        '/assets/tiles/09_tile_star.png',
  avatar:      '/assets/tiles/31_avatar_player.png',
  boostHammer: '/assets/tiles/11_booster_hammer.png',
  boostRocket: '/assets/tiles/12_booster_rocket.png',
  boostBomb:   '/assets/tiles/13_booster_bomb.png',
  boostShuffle:'/assets/tiles/14_booster_shuffle.png',
  navVillage:  '/assets/tiles/21_nav_village.png',
  navPlay:     '/assets/tiles/22_nav_play.png',
  navShop:     '/assets/tiles/23_nav_shop.png',
  navFriends:  '/assets/tiles/24_nav_friends.png',
};

// Kawaii palette (Pixi color = number)
const C = {
  ink:        0x3a1a05,
  inkDark:    0x1c0c02,
  inkSoft:    0x6a3815,
  paper:      0xfff5d8,
  paperLow:   0xffe6c8,
  bg:         0xfff1c8,
  wood:       0x3a1a05,
  candyRed:   0xff5c7a,
  candyPurple:0xa259ff,
  candyGreen: 0x6cd25c,
  candyBlue:  0x4fb2ff,
  gold:       0xffc824,
  goldDeep:   0xc97c1a,
  blueFill:   0x2c6dff,
  navText:    0xfff5d8,
  shadowSoft: 0x6a3815,
};

// Design space (logical) — everything sized to a 440-wide phone frame.
// On render, stage is scaled to fit window width (or letterboxed on PC).
const DESIGN_W = 440;
// Height is dynamic — calculated each resize from the actual viewport
let DESIGN_H = 820;

const LAYOUT = {
  PAD_TOP:     6,
  TOPBAR_H:    50,
  GAP_AFTER_TOPBAR: 6,
  GAE_H:       46,
  GAP_AFTER_GAE:    6,
  HUD_H:       70,
  GAP_AFTER_HUD:    0,    // prize slot overlaps board frame top
  DECK_H:      62,
  NAV_H:       64,
  SAFE_TOP:    0,
  SAFE_BOT:    0,
};

// =====================================================================
// [2] STATE
// =====================================================================
const state = {
  grid:       null,                  // [r][c] = {type, sp}
  gold:       0,
  gems:       0,
  shields:    3,
  energy:     ENERGY_MAX,
  meters:     {hammer:0, pig:0, shield:0},
  betIdx:     0,
  gaeProgress: 0,
  gaeTarget:  25,
  cascadeDepth: 0,
  cascadeMax:   0,
  busy:       false,
  selected:   null,                  // {r, c}
  autoMode:   false,
};

// =====================================================================
// [3] PIXI APP + GLOBALS
// =====================================================================
let app = null;            // PIXI.Application
let stage = null;          // root container
let tex = {};              // textureCache by ASSET key
let layer = {};            // named container layers
let ui = {};               // named widget refs (for live updates)
let tileSprites = [];      // [r][c] -> Sprite
let cellSize = 56;         // recalculated each layout pass
let boardW = 0, boardH = 0;
let isDesktop = false;

const anims = [];          // active animations

// =====================================================================
// [4] HELPERS — easing, formatting, color
// =====================================================================
function easeOut(t)    { return 1 - (1-t)*(1-t); }
function easeInOut(t)  { return t<0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }
function easeOutBack(t){
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t-1, 3) + c1 * Math.pow(t-1, 2);
}

function fmtNum(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'') + 'K';
  return String(Math.floor(n));
}

// =====================================================================
// [5] GAME LOGIC (pure — no Pixi)
// =====================================================================
function makeCell(type, sp) { return {type, sp: sp || SP_NONE}; }

function pickFreshTile(r, c) {
  // Reject runs of 3 during initial fill so the board starts unmatched.
  for (let attempt = 0; attempt < 30; attempt++) {
    const t = Math.floor(Math.random() * NUM_COLORS);
    if (c >= 2 && state.grid[r][c-1] && state.grid[r][c-1].type === t
              && state.grid[r][c-2] && state.grid[r][c-2].type === t) continue;
    if (r >= 2 && state.grid[r-1][c] && state.grid[r-1][c].type === t
              && state.grid[r-2][c] && state.grid[r-2][c].type === t) continue;
    return makeCell(t);
  }
  return makeCell(Math.floor(Math.random() * NUM_COLORS));
}

function pickReplenishTile() {
  // Roll the spawn table. THEME picks up everything past CHEST.
  const r = Math.random();
  let acc = 0;
  if (r < (acc += SPAWN_RATE.STAR))   return makeCell(TILE.STAR);
  if (r < (acc += SPAWN_RATE.WILD))   return makeCell(TILE.WILD);
  if (r < (acc += SPAWN_RATE.BOLT))   return makeCell(TILE.BOLT);
  if (r < (acc += SPAWN_RATE.PIG))    return makeCell(TILE.PIG);
  if (r < (acc += SPAWN_RATE.SHIELD)) return makeCell(TILE.SHIELD);
  if (r < (acc += SPAWN_RATE.CHEST))  return makeCell(TILE.CHEST);
  if (r < (acc += SPAWN_RATE.SACK))   return makeCell(TILE.SACK);
  if (r < (acc += SPAWN_RATE.COIN))   return makeCell(TILE.COIN);
  return makeCell(TILE.THEME);
}

function spawnFreshGrid() {
  state.grid = new Array(ROWS);
  for (let r = 0; r < ROWS; r++) state.grid[r] = new Array(COLS).fill(null);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) state.grid[r][c] = pickFreshTile(r, c);
  }
}

function tilesMatch(a, b) {
  if (!a || !b) return false;
  if (a.type === TILE.WILD || b.type === TILE.WILD) return true;
  return a.type === b.type;
}

function findMatches() {
  const matched = new Set();
  // Horizontal
  for (let r = 0; r < ROWS; r++) {
    let runStart = 0;
    for (let c = 1; c <= COLS; c++) {
      const cont = c < COLS && tilesMatch(state.grid[r][runStart], state.grid[r][c]);
      if (!cont) {
        if (c - runStart >= 3) {
          for (let i = runStart; i < c; i++) matched.add(r * COLS + i);
        }
        runStart = c;
      }
    }
  }
  // Vertical
  for (let c = 0; c < COLS; c++) {
    let runStart = 0;
    for (let r = 1; r <= ROWS; r++) {
      const cont = r < ROWS && tilesMatch(state.grid[runStart][c], state.grid[r][c]);
      if (!cont) {
        if (r - runStart >= 3) {
          for (let i = runStart; i < r; i++) matched.add(i * COLS + c);
        }
        runStart = r;
      }
    }
  }
  return matched;
}

function hasPossibleMove() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c < COLS - 1) {
        const a = state.grid[r][c], b = state.grid[r][c+1];
        state.grid[r][c] = b; state.grid[r][c+1] = a;
        const m = findMatches();
        state.grid[r][c] = a; state.grid[r][c+1] = b;
        if (m.size > 0) return true;
      }
      if (r < ROWS - 1) {
        const a = state.grid[r][c], b = state.grid[r+1][c];
        state.grid[r][c] = b; state.grid[r+1][c] = a;
        const m = findMatches();
        state.grid[r][c] = a; state.grid[r+1][c] = b;
        if (m.size > 0) return true;
      }
    }
  }
  return false;
}

function applyGravity() {
  // Pull existing tiles down, then fill empties from above.
  // Returns: array of {col, fromRow, toRow, tile, existing}
  const falls = [];
  for (let c = 0; c < COLS; c++) {
    let writeRow = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (state.grid[r][c]) {
        if (r !== writeRow) {
          falls.push({col:c, fromRow:r, toRow:writeRow, tile:state.grid[r][c], existing:true});
          state.grid[writeRow][c] = state.grid[r][c];
          state.grid[r][c] = null;
        }
        writeRow--;
      }
    }
    let spawnIdx = 0;
    while (writeRow >= 0) {
      const tile = pickReplenishTile();
      state.grid[writeRow][c] = tile;
      falls.push({col:c, fromRow:-1 - spawnIdx, toRow:writeRow, tile, existing:false});
      writeRow--;
      spawnIdx++;
    }
  }
  return falls;
}

function effectiveBet() { return BETS[state.betIdx] || BETS[0]; }

// =====================================================================
// [6] PIXI PRIMITIVE BUILDERS
// =====================================================================

// Chunky kawaii "pill" with hard drop-shadow + thick brown border.
// Returns a Container. The bg Graphics is accessible as .bgRef.
function buildPill(w, h, fill, opts) {
  opts = opts || {};
  const radius = opts.r !== undefined ? opts.r : Math.min(h/2, 14);
  const border = opts.border !== undefined ? opts.border : 2.5;
  const shadowOffset = opts.shadowOffset !== undefined ? opts.shadowOffset : 3;
  const c = new PIXI.Container();
  // Hard drop shadow
  if (opts.shadow !== false) {
    const sh = new PIXI.Graphics();
    sh.beginFill(C.shadowSoft, 1);
    sh.drawRoundedRect(0, shadowOffset, w, h, radius);
    sh.endFill();
    c.addChild(sh);
  }
  // Body
  const bg = new PIXI.Graphics();
  bg.lineStyle(border, C.ink, 1, 0.5);
  bg.beginFill(fill);
  bg.drawRoundedRect(0, 0, w, h, radius);
  bg.endFill();
  c.addChild(bg);
  c.bgRef = bg;
  c._w = w; c._h = h;
  return c;
}

function buildCircle(d, fill, opts) {
  return buildPill(d, d, fill, Object.assign({r: d/2}, opts || {}));
}

function makeLabel(str, opts) {
  opts = opts || {};
  const style = {
    fontFamily: 'Baloo 2, system-ui, sans-serif',
    fontSize:   opts.size || 14,
    fill:       opts.color !== undefined ? opts.color : C.ink,
    fontWeight: opts.weight || '900',
    align:      opts.align  || 'center',
    letterSpacing: opts.spacing || 0,
  };
  if (opts.stroke !== undefined) {
    style.stroke = opts.stroke;
    style.strokeThickness = opts.strokeT || 2;
  }
  const t = new PIXI.Text(str, style);
  t.resolution = 2;   // crisp on retina
  return t;
}

function makeIcon(textureKey, size) {
  const t = tex[textureKey];
  if (!t) return new PIXI.Container();
  const s = new PIXI.Sprite(t);
  s.anchor.set(0.5);
  if (size) { s.width = size; s.height = size; }
  return s;
}

// =====================================================================
// [7] LAYOUT BUILDERS — each returns a Container
// =====================================================================

// ---------- TOPBAR ----------
function buildTopbar() {
  const c = new PIXI.Container();
  const W = DESIGN_W - 16;
  c._W = W;

  // Avatar pill (40×40 circle, left)
  const avatar = buildCircle(40, C.paper);
  avatar.interactive = false;
  const av = makeIcon('avatar', 38);
  av.x = 20; av.y = 20;
  avatar.addChild(av);
  avatar.x = 0; avatar.y = 0;
  c.addChild(avatar);

  // Hamburger (right)
  const ham = buildCircle(40, C.paper);
  for (let i = 0; i < 3; i++) {
    const bar = new PIXI.Graphics();
    bar.beginFill(C.ink);
    bar.drawRoundedRect(0, 0, 18, 3, 1.5);
    bar.endFill();
    bar.x = 11; bar.y = 13 + i * 7;
    ham.addChild(bar);
  }
  ham.x = W - 40; ham.y = 0;
  c.addChild(ham);

  // Pills group (gold / gems / shield) centered between avatar + hamburger
  const group = new PIXI.Container();
  c.addChild(group);

  function buildCurrencyPill(iconKey, valueFn) {
    const pill = new PIXI.Container();
    const txt = makeLabel(valueFn(), {size: 14});
    txt.anchor.set(0, 0.5);
    const icon = makeIcon(iconKey, 22);
    // Measure & build bg
    txt.x = 30; txt.y = 17;
    const valWidth = Math.max(20, txt.width);
    const pw = 30 + valWidth + 10;
    const bg = buildPill(pw, 34, C.paper, {r: 17, border: 2.5});
    icon.x = 14; icon.y = 17;
    pill.addChild(bg);
    pill.addChild(icon);
    pill.addChild(txt);
    pill.txtRef = txt;
    pill.iconRef = icon;
    pill.bgRef = bg;
    pill.valueFn = valueFn;
    pill._pw = pw;
    pill.refresh = function() {
      this.txtRef.text = valueFn();
      const newW = 30 + Math.max(20, this.txtRef.width) + 10;
      if (newW !== this._pw) {
        // Rebuild bg to new width
        this.bgRef.clear();
        this.bgRef.lineStyle(2.5, C.ink, 1, 0.5);
        this.bgRef.beginFill(C.paper);
        this.bgRef.drawRoundedRect(0, 0, newW, 34, 17);
        this.bgRef.endFill();
        // Also redo shadow (first child of pill is shadow Graphics in buildPill)
        this._pw = newW;
      }
    };
    return pill;
  }

  const goldPill = buildCurrencyPill('coin',  () => fmtNum(state.gold));
  const gemsPill = buildCurrencyPill('star',  () => String(state.gems));
  const shieldPill = buildCurrencyPill('shield', () => String(state.shields));

  group.addChild(goldPill);
  group.addChild(gemsPill);
  group.addChild(shieldPill);

  function layoutPills() {
    let x = 0;
    [goldPill, gemsPill, shieldPill].forEach(p => { p.x = x; x += p._pw + 6; });
    const gw = x - 6;
    const avail = W - 40 - 40 - 16;
    group.x = 40 + 8 + (avail - gw) / 2;
    group.y = 0;
  }
  layoutPills();
  c.layoutPills = layoutPills;
  c.pills = {gold:goldPill, gems:gemsPill, shield:shieldPill};
  return c;
}

// ---------- GAE BAR ----------
function buildGaeBar() {
  const c = new PIXI.Container();
  const W = 240, H = 42;
  c._W = W; c._H = H;

  // Body pill
  const body = buildPill(W, H, C.paper, {r: H/2, border: 3});
  c.addChild(body);

  // Left icon (theme glove)
  const leftIcon = makeIcon('theme', 30);
  leftIcon.x = 22; leftIcon.y = H/2;
  c.addChild(leftIcon);

  // Right icon (chest = prize)
  const rightIcon = makeIcon('chest', 30);
  rightIcon.x = W - 22; rightIcon.y = H/2;
  c.addChild(rightIcon);

  // Track in middle
  const trackX = 44, trackW = W - 88, trackY = H/2 - 9, trackH = 18;
  const trackBg = new PIXI.Graphics();
  trackBg.lineStyle(2.5, C.ink, 1, 0.5);
  trackBg.beginFill(C.ink);
  trackBg.drawRoundedRect(trackX, trackY, trackW, trackH, 9);
  trackBg.endFill();
  c.addChild(trackBg);

  // Fill (purple-pink gradient simulated with single color)
  const fill = new PIXI.Graphics();
  c.addChild(fill);

  // Label
  const label = makeLabel('0/' + state.gaeTarget, {
    size: 11, color: 0xffffff, weight: '900', spacing: 0.3
  });
  label.anchor.set(0.5);
  label.x = trackX + trackW / 2;
  label.y = H / 2;
  c.addChild(label);

  c.refresh = function() {
    const pct = Math.max(0, Math.min(1, state.gaeProgress / state.gaeTarget));
    fill.clear();
    if (pct > 0) {
      fill.beginFill(C.candyPurple);
      fill.drawRoundedRect(trackX + 1, trackY + 1, Math.max(0, (trackW - 2) * pct), trackH - 2, 9);
      fill.endFill();
    }
    label.text = state.gaeProgress + '/' + state.gaeTarget;
  };
  c.refresh();
  return c;
}

// ---------- HUD ROW (VS box | prize slot | ? box) ----------
function buildHudRow() {
  const c = new PIXI.Container();
  const W = DESIGN_W - 16;
  c._W = W;
  c._H = LAYOUT.HUD_H;

  // VS (attack/glove) box — left
  const vsBox = buildHudBox(78, 64, 'theme', C.candyRed, 'hammer');
  vsBox.x = 4; vsBox.y = c._H - 64;
  c.addChild(vsBox);

  // ? (steal/chicken) box — right
  const qBox = buildHudBox(78, 64, 'pig', C.candyPurple, 'pig');
  qBox.x = W - 4 - 78; qBox.y = c._H - 64;
  c.addChild(qBox);

  // Prize slot — center, "carved" into the top of the board frame
  const prizeW = 180, prizeH = 50;
  const prize = new PIXI.Container();
  // Cream "window" with flat bottom corners — sits over the board top border
  const pbg = new PIXI.Graphics();
  pbg.lineStyle(3, C.ink, 1, 0.5);
  pbg.beginFill(C.paper);
  // Custom rounded-top, flat-bottom rectangle
  drawTopRoundRect(pbg, 0, 0, prizeW, prizeH, 18);
  pbg.endFill();
  prize.addChild(pbg);

  // Inner reward holder (chips spawn in here)
  const inner = new PIXI.Container();
  inner.y = prizeH / 2;
  inner._scaleBase = 1;
  inner.alpha = 0;
  prize.addChild(inner);

  prize.x = (W - prizeW) / 2;
  prize.y = c._H - prizeH;
  c.addChild(prize);

  c.prizeInner = inner;
  c.prizeBg = pbg;
  c.vsBox = vsBox;
  c.qBox = qBox;
  return c;
}

function buildHudBox(w, h, iconKey, accentColor, meterKey) {
  const box = new PIXI.Container();
  const bg = buildPill(w, h, C.paper, {r: 14, border: 2.5});
  box.addChild(bg);

  const icon = makeIcon(iconKey, 38);
  icon.x = w/2; icon.y = h/2 - 8;
  box.addChild(icon);

  // Meter bar at bottom
  const barW = w - 14, barH = 7;
  const barBg = new PIXI.Graphics();
  barBg.beginFill(C.ink);
  barBg.drawRoundedRect(7, h - 18, barW, barH, 4);
  barBg.endFill();
  box.addChild(barBg);

  const fill = new PIXI.Graphics();
  box.addChild(fill);

  const lbl = makeLabel('0/' + METER_CAP, {size: 9, color: C.ink, weight: '900'});
  lbl.anchor.set(0.5);
  lbl.x = w/2; lbl.y = h - 6;
  box.addChild(lbl);

  box.meterKey = meterKey;
  box.refresh = function() {
    const v = state.meters[meterKey] || 0;
    const pct = Math.min(1, v / METER_CAP);
    fill.clear();
    if (pct > 0) {
      fill.beginFill(accentColor);
      fill.drawRoundedRect(8, h - 17, (barW - 2) * pct, barH - 2, 4);
      fill.endFill();
    }
    lbl.text = v + '/' + METER_CAP;
  };
  box.refresh();
  return box;
}

function drawTopRoundRect(g, x, y, w, h, r) {
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y);
  g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h);
  g.lineTo(x, y + h);
  g.lineTo(x, y + r);
  g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}

// ---------- BOARD ----------
function buildBoard() {
  const c = new PIXI.Container();
  // The board frame is drawn dynamically in layoutScreen() once cellSize known
  c._frame = new PIXI.Graphics();
  c.addChild(c._frame);
  // Tile container — sized to cellSize × COLS / ROWS
  c._tiles = new PIXI.Container();
  c._tiles.x = 0; c._tiles.y = 0;
  c.addChild(c._tiles);
  return c;
}

// Draw / redraw the board frame Graphics.
function redrawBoardFrame() {
  const g = layer.board._frame;
  g.clear();
  // Frame inset slightly so its rounded corners poke out at the top sides.
  const W = boardW + 8;
  const H = boardH + 8;
  const x = -4, y = -4;
  // Drop shadow
  g.beginFill(C.shadowSoft, 0.18);
  g.drawRoundedRect(x, y + 4, W, H, 22);
  g.endFill();
  // Body
  g.lineStyle(3, C.ink, 1, 0.5);
  g.beginFill(C.paper);
  g.drawRoundedRect(x, y, W, H, 22);
  g.endFill();
}

// Build a tile sprite for a given cell, positioned at cell center
function makeTileSprite(cell, col, row) {
  const cont = new PIXI.Container();
  // Pivot at center so we can scale/rotate cleanly
  const iconKey = TYPE_TO_KEY[cell.type] || 'coin';
  const ico = makeIcon(iconKey, cellSize * 0.78);
  cont.addChild(ico);
  cont.x = col * cellSize + cellSize / 2;
  cont.y = row * cellSize + cellSize / 2;
  cont._iconRef = ico;
  cont._cell = cell;
  cont._baseScale = 1;
  // Interactive — clicking a tile selects/swaps
  cont.eventMode = 'static';
  cont.cursor = 'pointer';
  cont.on('pointerdown', () => onTilePointerDown(cont));
  cont.hitArea = new PIXI.Rectangle(-cellSize/2, -cellSize/2, cellSize, cellSize);
  cont._rc = {r: row, c: col};
  return cont;
}

function buildBoardTiles() {
  layer.board._tiles.removeChildren();
  tileSprites = new Array(ROWS);
  for (let r = 0; r < ROWS; r++) {
    tileSprites[r] = new Array(COLS);
    for (let c = 0; c < COLS; c++) {
      const cell = state.grid[r][c];
      const sp = makeTileSprite(cell, c, r);
      tileSprites[r][c] = sp;
      layer.board._tiles.addChild(sp);
    }
  }
}

// ---------- ACTION DECK (4 boosters + AUTO) ----------
function buildActionDeck() {
  const c = new PIXI.Container();
  c._H = LAYOUT.DECK_H;
  // Dark wood background (same color as nav — they merge visually)
  const bg = new PIXI.Graphics();
  bg.beginFill(C.wood);
  bg.drawRect(0, 0, DESIGN_W, c._H);
  bg.endFill();
  // Top edge dark line
  bg.beginFill(C.inkDark);
  bg.drawRect(0, 0, DESIGN_W, 3);
  bg.endFill();
  c.addChild(bg);

  const items = [];
  const boosters = [
    {key:'boostHammer', label:'hammer'},
    {key:'boostRocket', label:'rocket'},
    {key:'boostBomb',   label:'bomb'},
    {key:'boostShuffle',label:'shuffle'},
  ];
  // 2 boosters | AUTO | 2 boosters
  const order = [boosters[0], boosters[1], 'auto', boosters[2], boosters[3]];

  for (const item of order) {
    if (item === 'auto') {
      const auto = buildAutoButton();
      items.push(auto);
      c.addChild(auto);
    } else {
      const b = buildBoosterCircle(item.key, item.label);
      items.push(b);
      c.addChild(b);
    }
  }

  // Layout — center the row
  function layoutDeck() {
    let total = 0;
    const gap = 10;
    for (const it of items) total += it._w;
    total += gap * (items.length - 1);
    let x = (DESIGN_W - total) / 2;
    const cy = c._H / 2;
    for (const it of items) {
      it.x = x;
      it.y = cy - it._h / 2;
      x += it._w + gap;
    }
  }
  layoutDeck();
  c.layoutDeck = layoutDeck;
  c.items = items;
  return c;
}

function buildBoosterCircle(iconKey, key) {
  const d = 42;
  const c = buildCircle(d, C.paper);
  c._w = d; c._h = d;
  const ic = makeIcon(iconKey, d * 0.74);
  ic.x = d/2; ic.y = d/2;
  c.addChild(ic);
  c.eventMode = 'static';

function buildAutoButton() {
  const w = 140, h = 42;
  const c = buildPill(w, h, C.paper, {r: 14, border: 3});
  c._w = w; c._h = h;
  const lbl = makeLabel('AUTO', {size: 13, weight: '900', spacing: 1});
  lbl.anchor.set(0.5);
  lbl.x = w/2; lbl.y = h/2;
  c.addChild(lbl);
  c.eventMode = 'static';

  const c = new PIXI.Container();

  const bg = new PIXI.Graphics();
  bg.beginFill(C.wood);

  // 5 elements: village | shop | energyPill | play | friends

  for (const t of tabs) {

  function layoutNav() {

    const totalTabsW = tabW * 4;
    const energyW = items[2]._w;

    let x = gapBetween / 2;
    // village
    items[0].x = x; x += tabW + gapBetween;
    items[0].y = c._H / 2 - items[0]._h / 2;
    // shop
    items[1].x = x; x += tabW + gapBetween;

    items[2].y = c._H / 2 - items[2]._h / 2;
    // play
    items[3].x = x; x += tabW + gapBetween;
    items[3].y = c._H / 2 - items[3]._h / 2;
    // friends
    items[4].x = x;
    items[4].y = c._H / 2 - items[4]._h / 2;
  }

  for (const it of items) c.addChild(it);
  c.items = items;

// =====================================================================
// [8] LAYOUT — position everything inside the design 440×H frame
// =====================================================================
function computeLayout() {
  // Outer frame target size based on viewport.
  // Mobile: width-fit, height = window
  // Desktop: phone-frame letterbox at 440 × min(820, window-h)
  const winW = window.innerWidth;
  const winH = window.innerHeight;
  isDesktop = winW > 600;
  document.body.setAttribute('data-platform', isDesktop ? 'desktop' : 'mobile');

  let designH;
  let scale;
  if (isDesktop) {
    designH = Math.min(820, winH);
    scale = Math.min(winW / DESIGN_W, winH / designH);
  } else {
    // Width-fit; height equals scaled viewport height
    scale = winW / DESIGN_W;
    designH = winH / scale;
  }
  DESIGN_H = designH;
  app.renderer.resize(winW, winH);

  // Stage transform
  stage.scale.set(scale);
  stage.x = (winW - DESIGN_W * scale) / 2;
  stage.y = isDesktop ? (winH - designH * scale) / 2 : 0;

  // Body bg pixi rect (fills the design rect — covers the bg between
  // letterbox edges so the dark body shows around it on PC)
  if (!ui.bgRect) {
    ui.bgRect = new PIXI.Graphics();
    stage.addChildAt(ui.bgRect, 0);
  }
  ui.bgRect.clear();
  ui.bgRect.beginFill(C.bg);
  ui.bgRect.drawRect(0, 0, DESIGN_W, designH);
  ui.bgRect.endFill();

  // Now position layers
  let y = LAYOUT.PAD_TOP + LAYOUT.SAFE_TOP;
  layer.topbar.x = 8; layer.topbar.y = y; y += LAYOUT.TOPBAR_H + LAYOUT.GAP_AFTER_TOPBAR;

  // GAE bar — centered horizontally
  const gaeW = layer.gae._W;
  layer.gae.x = (DESIGN_W - gaeW) / 2;
  layer.gae.y = y;
  y += LAYOUT.GAE_H + LAYOUT.GAP_AFTER_GAE;

  // Board chrome below: deck + nav stuck to bottom
  const chromeBelow = LAYOUT.DECK_H + LAYOUT.NAV_H + LAYOUT.SAFE_BOT;

  // Available board height = designH - y - chromeBelow - HUD_H + (overlap allowance)
  // HUD row sits ABOVE the board, but the prize slot overlaps the board's top.
  // So we treat HUD as taking HUD_H but the board's actual top starts 3px under
  // its bottom (slight overlap).
  let availableForBoard = designH - y - LAYOUT.HUD_H - chromeBelow + 3;

  // Cell size — fit 7 cols in (DESIGN_W - padding) AND 7 rows in available
  const boardPaddingX = 12;
  const cellByW = (DESIGN_W - boardPaddingX * 2) / COLS;
  const cellByH = availableForBoard / ROWS;
  cellSize = Math.min(64, Math.floor(Math.min(cellByW, cellByH)));
  if (cellSize < 32) cellSize = 32;

  boardW = cellSize * COLS;
  boardH = cellSize * ROWS;

  // HUD row width = DESIGN_W - 16, positioned above board (left aligned to board)
  layer.hud.x = (DESIGN_W - (DESIGN_W - 16)) / 2;
  layer.hud.y = y;

  // Board centered horizontally
  layer.board.x = (DESIGN_W - boardW) / 2;
  layer.board.y = y + LAYOUT.HUD_H - 3;          // 3px overlap with prize slot

  redrawBoardFrame();

  // Reposition / scale tile sprites if cellSize changed
  if (tileSprites.length > 0) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const sp = tileSprites[r][c];
        if (!sp) continue;
        sp.x = c * cellSize + cellSize / 2;
        sp.y = r * cellSize + cellSize / 2;
        if (sp._iconRef) {
          sp._iconRef.width  = cellSize * 0.78;
          sp._iconRef.height = cellSize * 0.78;
        }
        sp.hitArea = new PIXI.Rectangle(-cellSize/2, -cellSize/2, cellSize, cellSize);
      }
    }
  }

  // Deck + nav docked to bottom of design area
  layer.deck.y = designH - LAYOUT.NAV_H - LAYOUT.DECK_H - LAYOUT.SAFE_BOT;
  layer.nav.y  = designH - LAYOUT.NAV_H - LAYOUT.SAFE_BOT;
  layer.deck.layoutDeck && layer.deck.layoutDeck();
  layer.nav.layoutNav && layer.nav.layoutNav();
}

// =====================================================================
// [9] ANIMATION SYSTEM
// =====================================================================
function addAnim(durationMs, update, onDone) {
  const start = performance.now();
  const a = {
    start, dur: durationMs,
    step(now) {
      const p = Math.min(1, (now - start) / durationMs);
      update(p);
      if (p >= 1) { if (onDone) onDone(); return true; }
      return false;
    }
  };
  anims.push(a);
  return a;
}

function animateSwap(r1, c1, r2, c2, onDone) {
  const s1 = tileSprites[r1][c1];
  const s2 = tileSprites[r2][c2];
  if (!s1 || !s2) { if (onDone) onDone(); return; }
  const sx1 = s1.x, sy1 = s1.y;
  const sx2 = s2.x, sy2 = s2.y;
  addAnim(220, (p) => {
    const e = easeInOut(p);
    s1.x = sx1 + (sx2 - sx1) * e;
    s1.y = sy1 + (sy2 - sy1) * e;
    s2.x = sx2 + (sx1 - sx2) * e;
    s2.y = sy2 + (sy1 - sy2) * e;
  }, () => {
    // Snap sprite references in tileSprites
    tileSprites[r1][c1] = s2;
    tileSprites[r2][c2] = s1;
    if (s1._rc) { s1._rc.r = r2; s1._rc.c = c2; }
    if (s2._rc) { s2._rc.r = r1; s2._rc.c = c1; }
    if (onDone) onDone();
  });
}

function animatePop(cellKeys, onDone) {
  const sprites = [];
  for (const k of cellKeys) {
    const r = Math.floor(k / COLS);
    const c = k % COLS;
    const s = tileSprites[r][c];
    if (s) sprites.push({s, r, c});
  }
  if (sprites.length === 0) { if (onDone) onDone(); return; }
  addAnim(260, (p) => {
    const e = easeOut(p);
    const sc = 1 - e;
    const a = 1 - e;
    for (const it of sprites) {
      it.s.scale.set(sc);
      it.s.alpha = a;
    }
  }, () => {
    for (const it of sprites) {
      if (it.s.parent) it.s.parent.removeChild(it.s);
      it.s.destroy({children:true});
      tileSprites[it.r][it.c] = null;
      state.grid[it.r][it.c] = null;
    }
    if (onDone) onDone();
  });
}

function animateFall(falls, onDone) {
  if (!falls || falls.length === 0) { if (onDone) onDone(); return; }
  let active = 0;
  let finished = 0;
  const baseDur = 320;
  const perRowDelay = 20;

  for (const f of falls) {
    let sprite;
    if (f.existing) {
      sprite = tileSprites[f.fromRow][f.col];
      tileSprites[f.fromRow][f.col] = null;
    } else {
      sprite = makeTileSprite(f.tile, f.col, f.toRow);
      layer.board._tiles.addChild(sprite);
    }
    tileSprites[f.toRow][f.col] = sprite;
    if (sprite._rc) { sprite._rc.r = f.toRow; sprite._rc.c = f.col; }
    const dist = Math.abs(f.toRow - f.fromRow);
    const dur = baseDur + dist * perRowDelay;
    const startY = f.fromRow * cellSize + cellSize / 2;
    const endY   = f.toRow   * cellSize + cellSize / 2;
    sprite.x = f.col * cellSize + cellSize / 2;
    sprite.y = startY;
    active++;
    addAnim(dur, (p) => {
      const e = easeOut(p);
      sprite.y = startY + (endY - startY) * e;
    }, () => {
      finished++;
      if (finished >= active) { if (onDone) onDone(); }
    });
  }
}

// =====================================================================
// [10] CASCADE + SCORING
// =====================================================================
function scoreMatchedCells(cellKeys) {
  const mult = CASCADE_MULT[Math.min(state.cascadeDepth, CASCADE_MULT.length - 1)];
  const bet = effectiveBet();
  let stepCoins = 0;
  const reward = {gold:0, hammer:0, pig:0, shield:0, bolt:0};

  for (const key of cellKeys) {
    const r = Math.floor(key / COLS);
    const c = key % COLS;
    const cell = state.grid[r][c];
    if (!cell) continue;
    const type = cell.type;
    const isGold = (
      type === TILE.COIN || type === TILE.SACK || type === TILE.CHEST ||
      type === TILE.WILD || type === TILE.STAR || !!cell.sp
    );
    if (isGold) {
      const spBonus = cell.sp ? 4 : 1;
      const cellVal = (TILE_VALUE[type] || 1) * spBonus;
      stepCoins += cellVal * bet.mult * mult;
    }
    if (type === TILE.PIG)         reward.pig++;
    else if (type === TILE.SHIELD) reward.shield++;
    else if (type === TILE.THEME)  reward.hammer++;
    else if (type === TILE.BOLT)   reward.bolt++;
  }
  const earnedInt = Math.floor(stepCoins);
  state.gold += earnedInt;
  reward.gold = earnedInt;

  const chargeMult = Math.max(1, Math.floor(mult * 0.5 + bet.mult * 0.5));
  state.meters.hammer = Math.min(METER_CAP, state.meters.hammer + reward.hammer * chargeMult);
  state.meters.pig    = Math.min(METER_CAP, state.meters.pig    + reward.pig    * chargeMult);
  state.meters.shield = Math.min(METER_CAP, state.meters.shield + reward.shield * chargeMult);

  if (reward.bolt > 0) {
    const energyGain = Math.max(1, Math.floor(reward.bolt * Math.max(1, mult)));
    state.energy = Math.min(ENERGY_MAX, state.energy + energyGain);
  }
  if (reward.hammer > 0) {
    state.gaeProgress = Math.min(state.gaeTarget, state.gaeProgress + reward.hammer);
  }
  refreshUI();
  showPrizeBanner(reward);
}

function processCascadeStep(seededMatched) {
  let matched;
  if (seededMatched && seededMatched.size > 0) matched = new Set(seededMatched);
  else                                          matched = findMatches();

  if (matched.size === 0) {
    state.busy = false;
    state.cascadeDepth = 0;
    state.cascadeMax = 0;
    if (!hasPossibleMove()) reshuffleVisible();
    return;
  }
  state.cascadeDepth++;
  state.cascadeMax = Math.max(state.cascadeMax, state.cascadeDepth);

  scoreMatchedCells(matched);

  const cellKeys = Array.from(matched);
  animatePop(cellKeys, () => {
    const falls = applyGravity();
    animateFall(falls, () => processCascadeStep(null));
  });
}

function attemptSwap(r1, c1, r2, c2) {
  if (state.busy) return;
  state.busy = true;
  state.selected = null;

  const a = state.grid[r1][c1];
  const b = state.grid[r2][c2];
  state.grid[r1][c1] = b;
  state.grid[r2][c2] = a;
  const matches = findMatches();

  if (matches.size === 0) {
    // Revert
    state.grid[r1][c1] = a;
    state.grid[r2][c2] = b;
    animateSwap(r1, c1, r2, c2, () => {
      animateSwap(r1, c1, r2, c2, () => { state.busy = false; });
    });
    return;
  }
  animateSwap(r1, c1, r2, c2, () => processCascadeStep(matches));
}

function reshuffleVisible() {
  // Wipe + regenerate. Animate as a quick fade.
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const sp = tileSprites[r][c];
      if (sp && sp.parent) sp.parent.removeChild(sp);
      if (sp) sp.destroy({children:true});
      tileSprites[r][c] = null;
    }
  }
  spawnFreshGrid();
  buildBoardTiles();
}

// =====================================================================
// [11] INPUT — tile selection + swap
// =====================================================================
function onTilePointerDown(sp) {
  if (state.busy) return;
  const {r, c} = sp._rc;
  if (!state.selected) {
    state.selected = {r, c};
    // Visual selection hint — slight scale up
    sp.scale.set(1.08);
    return;
  }
  const prev = state.selected;
  // Reset previous selection scale
  const prevSp = tileSprites[prev.r][prev.c];
  if (prevSp) prevSp.scale.set(1);
  state.selected = null;

  // Same cell tapped twice = deselect
  if (prev.r === r && prev.c === c) return;
  // Adjacent? swap. Otherwise treat the new tap as a fresh selection.
  const dr = Math.abs(prev.r - r);
  const dc = Math.abs(prev.c - c);
  if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
    attemptSwap(prev.r, prev.c, r, c);
  } else {
    state.selected = {r, c};
    sp.scale.set(1.08);
  }
}

// =====================================================================
// [12] PRIZE BANNER
// =====================================================================
let _prizeTimer = null;
function showPrizeBanner(reward) {
  const inner = layer.hud.prizeInner;
  if (!inner) return;
  inner.removeChildren();

  const chips = [];
  if (reward.gold   > 0) chips.push({key:'coin',   amt: fmtNum(reward.gold)});
  if (reward.hammer > 0) chips.push({key:'theme',  amt: reward.hammer});
  if (reward.pig    > 0) chips.push({key:'pig',    amt: reward.pig});
  if (reward.shield > 0) chips.push({key:'shield', amt: reward.shield});
  if (reward.bolt   > 0) chips.push({key:'bolt',   amt: reward.bolt});
  if (chips.length === 0) return;

  // Build chip row
  const chipContainers = [];
  let totalW = 0;
  const chipGap = 8;
  for (const ch of chips) {
    const cc = new PIXI.Container();
    const ic = makeIcon(ch.key, 24);
    ic.x = 12; ic.y = 0;
    cc.addChild(ic);
    const lbl = makeLabel('+' + ch.amt, {size: 16, color: C.ink, weight: '900'});
    lbl.anchor.set(0, 0.5);
    lbl.x = 26; lbl.y = 0;
    cc.addChild(lbl);
    cc._w = 26 + lbl.width;
    chipContainers.push(cc);
    totalW += cc._w + chipGap;
  }
  totalW -= chipGap;
  let x = -totalW / 2;
  for (const cc of chipContainers) {
    cc.x = x;
    inner.addChild(cc);
    x += cc._w + chipGap;
  }

  // Pop animation
  inner.alpha = 0;
  inner.scale.set(0.55);
  addAnim(180, (p) => { inner.alpha = p; });
  addAnim(320, (p) => { inner.scale.set(0.55 + easeOutBack(p) * 0.45); });

  if (_prizeTimer) clearTimeout(_prizeTimer);
  _prizeTimer = setTimeout(() => {
    addAnim(220, (p) => { inner.alpha = 1 - p; }, () => { inner.alpha = 0; });
  }, 1600);
}

// =====================================================================
// [13] UI REFRESH
// =====================================================================
function refreshUI() {
  if (layer.topbar) {
    layer.topbar.pills.gold.refresh();
    layer.topbar.pills.gems.refresh();
    layer.topbar.pills.shield.refresh();
    layer.topbar.layoutPills();
  }
  if (layer.gae && layer.gae.refresh) layer.gae.refresh();
  if (layer.hud) {
    layer.hud.vsBox.refresh();
    layer.hud.qBox.refresh();
  }
  if (layer.nav && layer.nav.energyPill && layer.nav.energyPill.refresh) {
    layer.nav.energyPill.refresh();
  }
}

// =====================================================================
// [14] BOOT
// =====================================================================
async function boot() {
  // 1. Create app
  app = new PIXI.Application({
    backgroundAlpha: 0,
    antialias: true,
    resolution: Math.min(2, window.devicePixelRatio || 1),
    autoDensity: true,
    width: window.innerWidth,
    height: window.innerHeight,
  });
  document.getElementById('app').appendChild(app.view);
  stage = app.stage;
  stage.sortableChildren = true;

  // 2. Load assets — bundle API returns a {key:Texture} map, which is
  //    exactly what tex[] needs. Direct assignment, no second lookup.
  //    (Previous code awaited load() then Texture.from(src) which gave
  //    back empty textures because the cache key didn't always match.)
  try {
    PIXI.Assets.addBundle('main', ASSET);
    const loaded = await PIXI.Assets.loadBundle('main');
    for (const k in loaded) tex[k] = loaded[k];
    console.log('Pixi loaded', Object.keys(tex).length, 'textures');
  } catch (e) {
    console.error('Asset bundle load failed:', e);
    // Fallback: try each one individually so a single 404 doesn't kill the boot
    for (const [k, src] of Object.entries(ASSET)) {
      try { tex[k] = await PIXI.Assets.load(src); }
      catch (e2) { console.warn('failed:', k, src, e2); }
    }
  }

  // 3. Init grid
  spawnFreshGrid();

  // 4. Build all UI layers
  layer.topbar = buildTopbar();        stage.addChild(layer.topbar);
  layer.gae    = buildGaeBar();        stage.addChild(layer.gae);
  layer.hud    = buildHudRow();        stage.addChild(layer.hud);
  layer.board  = buildBoard();         stage.addChild(layer.board);
  layer.deck   = buildActionDeck();    stage.addChild(layer.deck);
  layer.nav    = buildBottomNav();     stage.addChild(layer.nav);

  // 5. Layout pass + populate board tiles
  computeLayout();
  buildBoardTiles();

  // 6. Animation ticker — drives all anims[] entries
  app.ticker.add(() => {
    const now = performance.now();
    for (let i = anims.length - 1; i >= 0; i--) {
      if (anims[i].step(now)) anims.splice(i, 1);
    }
  });

  // 7. Resize
  window.addEventListener('resize', () => {
    computeLayout();
  });

  // 8. Hide boot screen
  const boot = document.getElementById('boot');
  if (boot) boot.classList.add('hide');
}

// Wait for font to be ready then boot.
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(boot).catch(() => boot());
} else {
  boot();
}
